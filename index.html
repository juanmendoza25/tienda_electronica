<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Electrónica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Tienda de Electrónica</h1>
        <nav>
            <ul>
                <li><a href="#pantallas">Pantallas</a></li>
                <li><a href="#mousses">Mouses</a></li>
                <li><a href="#teclados">Teclados</a></li>
                <li><a href="#audifonos">Audífonos</a></li>
                <li><a href="#pc">PC</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- Sección de Pantallas -->
        <section id="pantallas">
            <h2>Pantallas</h2>
            <div class="productos">
                <div class="producto">
                    <input type="checkbox" id="pantalla1" data-nombre="Pantalla 1" data-precio="200">
                    <label for="pantalla1">
                        <h3>Pantalla 1</h3>
                        <img src="img/pantalla1.jpg" alt="Pantalla 1">
                        <p>Descripción de la pantalla 1.</p>
                        <span class="precio">$200</span>
                    </label>
                </div>
                <div class="producto">
                    <input type="checkbox" id="pantalla2" data-nombre="Pantalla 2" data-precio="250">
                    <label for="pantalla2">
                        <h3>Pantalla 2</h3>
                        <img src="img/pantalla2.jpg" alt="Pantalla 2">
                        <p>Descripción de la pantalla 2.</p>
                        <span class="precio">$250</span>
                    </label>
                </div>
                <div class="producto">
                    <input type="checkbox" id="pantalla3" data-nombre="Pantalla 3" data-precio="300">
                    <label for="pantalla3">
                        <h3>Pantalla 3</h3>
                        <img src="img/pantalla3.jpg" alt="Pantalla 3">
                        <p>Descripción de la pantalla 3.</p>
                        <span class="precio">$300</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- Sección de Mouses -->
        <section id="mousses">
            <h2>Mouses</h2>
            <div class="productos">
                <div class="producto">
                    <input type="checkbox" id="mouse1" data-nombre="Mouse 1" data-precio="20">
                    <label for="mouse1">
                        <h3>Mouse 1</h3>
                        <img src="img/mouse1.jpg" alt="Mouse 1">
                        <p>Descripción del mouse 1.</p>
                        <span class="precio">$20</span>
                    </label>
                </div>
                <div class="producto">
                    <input type="checkbox" id="mouse2" data-nombre="Mouse 2" data-precio="30">
                    <label for="mouse2">
                        <h3>Mouse 2</h3>
                        <img src="img/mouse2.jpg" alt="Mouse 2">
                        <p>Descripción del mouse 2.</p>
                        <span class="precio">$30</span>
                    </label>
                </div>
                <div class="producto">
                    <input type="checkbox" id="mouse3" data-nombre="Mouse 3" data-precio="40">
                    <label for="mouse3">
                        <h3>Mouse 3</h3>
                        <img src="img/mouse3.jpg" alt="Mouse 3">
                        <p>Descripción del mouse 3.</p>
                        <span class="precio">$40</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- Sección de Teclados -->
        <section id="teclados">
            <h2>Teclados</h2>
            <div class="productos">
                <div class="producto">
                    <input type="checkbox" id="teclado1" data-nombre="Teclado 1" data-precio="50">
                    <label for="teclado1">
                        <h3>Teclado 1</h3>
                        <img src="img/teclado1.jpg" alt="Teclado 1">
                        <p>Descripción del teclado 1.</p>
                        <span class="precio">$50</span>
                    </label>
                </div>
                <div class="producto">
                    <input type="checkbox" id="teclado2" data-nombre="Teclado 2" data-precio="60">
                    <label for="teclado2">
                        <h3>Teclado 2</h3>
                        <img src="img/teclado2.jpg" alt="Teclado 2">
                        <p>Descripción del teclado 2.</p>
                        <span class="precio">$60</span>
                    </label>
                </div>
                <div class="producto">
                    <input type="checkbox" id="teclado3" data-nombre="Teclado 3" data-precio="70">
                    <label for="teclado3">
                        <h3>Teclado 3</h3>
                        <img src="img/teclado3.jpg" alt="Teclado 3">
                        <p>Descripción del teclado 3.</p>
                        <span class="precio">$70</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- Sección de Audífonos -->
        <section id="audifonos">
            <h2>Audífonos</h2>
            <div class="productos">
                <div class="producto">
                    <input type="checkbox" id="audifonos1" data-nombre="Audífonos 1" data-precio="80">
                    <label for="audifonos1">
                        <h3>Audífonos 1</h3>
                        <img src="img/audifonos1.jpg" alt="Audífonos 1">
                        <p>Descripción de los audífonos 1.</p>
                        <span class="precio">$80</span>
                    </label>
                </div>
                <div class="producto">
                    <input type="checkbox" id="audifonos2" data-nombre="Audífonos 2" data-precio="90">
                    <label for="audifonos2">
                        <h3>Audífonos 2</h3>
                        <img src="img/audifonos2.jpg" alt="Audífonos 2">
                        <p>Descripción de los audífonos 2.</p>
                        <span class="precio">$90</span>
                    </label>
                </div>
                <div class="producto">
                    <input type="checkbox" id="audifonos3" data-nombre="Audífonos 3" data-precio="100">
                    <label for="audifonos3">
                        <h3>Audífonos 3</h3>
                        <img src="img/audifonos3.jpg" alt="Audífonos 3">
                        <p>Descripción de los audífonos 3.</p>
                        <span class="precio">$100</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- Sección de PC -->
        <section id="pc">
            <h2>PC</h2>
            <div class="productos">
                <div class="producto">
                    <input type="checkbox" id="pc1" data-nombre="PC 1" data-precio="1000">
                    <label for="pc1">
                        <h3>PC 1</h3>
                        <img src="img/pc1.jpg" alt="PC 1">
                        <p>Descripción de la PC 1.</p>
                        <span class="precio">$1000</span>
                    </label>
                </div>
                <div class="producto">
                    <input type="checkbox" id="pc2" data-nombre="PC 2" data-precio="1200">
                    <label for="pc2">
                        <h3>PC 2</h3>
                        <img src="img/pc2.jpg" alt="PC 2">
                        <p>Descripción de la PC 2.</p>
                        <span class="precio">$1200</span>
                    </label>
                </div>
                <div class="producto">
                    <input type="checkbox" id="pc3" data-nombre="PC 3" data-precio="1500">
                    <label for="pc3">
                        <h3>PC 3</h3>
                        <img src="img/pc3.jpg" alt="PC 3">
                        <p>Descripción de la PC 3.</p>
                        <span class="precio">$1500</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- Sección de Resumen -->
        <section id="resumen">
            <h2>Articulos seleccionados</h2>
            <div id="lista-seleccionados">
                <p>No has seleccionado ningún producto.</p>
            </div>
            <p>Total: $<span id="total">0</span></p>
        </section>
    </main>

    <footer>
        <p>Tienda de Electrónica</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
